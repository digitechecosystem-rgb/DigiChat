
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiChat | By DigiTech</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:#eef2f7;color:#172033;
}
header{
  background:#172554;color:white;padding:16px 5%;
  display:flex;justify-content:space-between;align-items:center;
}
header h2{margin:0}
select,button,input{font:inherit}
select{padding:9px;border-radius:8px;border:0}
.container{max-width:1000px;margin:25px auto;padding:15px}
.card{
  background:white;padding:22px;border-radius:15px;
  box-shadow:0 5px 20px #0001;margin-bottom:15px;
}
input{
  width:100%;padding:13px;margin:8px 0 14px;
  border:1px solid #ccd3df;border-radius:8px;
}
button{
  padding:12px 18px;border:0;border-radius:8px;
  background:#2563eb;color:white;cursor:pointer;
}
button:hover{background:#1d4ed8}
.secondary{background:#475569}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:300px 1fr;gap:15px}
#chatList{max-height:450px;overflow:auto}
.chatItem{
  padding:13px;border-bottom:1px solid #eee;
  cursor:pointer;overflow-wrap:anywhere;
}
.chatItem:hover{background:#eff6ff}
#messages{
  height:380px;overflow:auto;padding:12px;
  background:#f8fafc;border-radius:10px;
}
.msg{
  background:#dbeafe;padding:10px 13px;
  border-radius:12px;margin:8px 0;max-width:85%;
  overflow-wrap:anywhere;
}
.mine{background:#dcfce7;margin-left:auto}
.small{font-size:12px;color:#64748b}
#status{margin:10px 0;color:#b91c1c}
#chatHeader{overflow-wrap:anywhere}
@media(max-width:700px){
  #app{grid-template-columns:1fr}
  #messages{height:350px}
}
</style>
</head>

<body>
<header>
  <h2>💬 DigiChat</h2>
  <select id="language">
    <option value="en">English</option>
    <option value="mr">मराठी</option>
    <option value="hi">हिन्दी</option>
  </select>
</header>

<div class="container">

  <section id="authBox" class="card">
    <h2 id="authTitle">Welcome to DigiChat</h2>
    <p id="authDescription">Create your account or login.</p>

    <label id="emailLabel">Email</label>
    <input id="email" type="email" placeholder="Enter your email">

    <label id="passwordLabel">Password</label>
    <input id="password" type="password" placeholder="Minimum 6 characters">

    <button id="authButton">Login</button>
    <button id="toggleAuth" class="secondary">Create account</button>
    <p id="status"></p>
  </section>

  <section id="mainBox" class="hidden">
    <div class="card">
      <h3 id="accountTitle">Your Account</h3>
      <p id="userEmail"></p>
      <p class="small" id="uidText"></p>
      <button id="copyUID" class="secondary">Copy My UID</button>
      <button id="logout">Logout</button>
    </div>

    <div id="app">
      <div class="card">
        <h3 id="chatsTitle">My Chats</h3>
        <label id="friendLabel">Friend's Firebase UID</label>
        <input id="friendUID" placeholder="Paste your friend's UID">
        <button id="createChat">Start Chat</button>
        <p id="chatStatus" class="small"></p>
        <hr>
        <div id="chatList"></div>
      </div>

      <div class="card">
        <h3 id="chatHeader">Select a chat</h3>
        <div id="messages"></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <input id="messageInput" placeholder="Type a message..." style="margin:0">
          <button id="sendButton">Send</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  getFirestore, collection, addDoc, query, where,
  onSnapshot, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyD0OMTU2s1kRQ_ljFIJpk4JvZlYSUZA5jI",
  authDomain: "digichat-e5c5a.firebaseapp.com",
  projectId: "digichat-e5c5a",
  storageBucket: "digichat-e5c5a.firebasestorage.app",
  messagingSenderId: "291258843320",
  appId: "1:291258843320:web:8f026f787ecdc0573d344d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let isSignup = false;
let activeChat = null;
let stopChats = null;
let stopMessages = null;
let language = localStorage.getItem("digichat-language") || "en";

const words = {
 en:{
  welcome:"Welcome to DigiChat",description:"Create your account or login.",
  email:"Email",password:"Password",login:"Login",
  signup:"Create account",account:"Your Account",copy:"Copy My UID",
  logout:"Logout",chats:"My Chats",friend:"Friend's Firebase UID",
  start:"Start Chat",select:"Select a chat",type:"Type a message...",
  send:"Send",empty:"No chats yet.",created:"Chat created!",
  invalid:"Enter a valid friend's UID.",self:"You cannot chat with yourself.",
  sent:"Message sent.",failed:"Error: ",signupMode:"Create your account",
  loginMode:"Already have an account? Login"
 },
 mr:{
  welcome:"DigiChat madhye tumche swagat aahe",
  description:"Nave account tayar kara kiwa Login kara.",
  email:"Email",password:"Password",login:"Login",
  signup:"Nave account tayar kara",account:"Tumche Account",
  copy:"Maza UID Copy kara",logout:"Logout",chats:"Majhya Gappa",
  friend:"Friend cha Firebase UID",start:"Chat suru kara",
  select:"Chat nivda",type:"Message liha...",send:"Pathva",
  empty:"Ajun chat nahi.",created:"Chat tayar zala!",
  invalid:"Barobar Friend UID taka.",self:"Swatah sobat chat karta yenar nahi.",
  sent:"Message pathavla.",failed:"Error: ",
  signupMode:"Nave account tayar kara",
  loginMode:"Account aahe? Login kara"
 },
 hi:{
  welcome:"DigiChat mein aapka swagat hai",
  description:"Account banaye ya Login karein.",
  email:"Email",password:"Password",login:"Login",
  signup:"Account banaye",account:"Aapka Account",
  copy:"Mera UID Copy karein",logout:"Logout",chats:"Meri Chats",
  friend:"Friend ka Firebase UID",start:"Chat shuru karein",
  select:"Chat chunein",type:"Message likhein...",send:"Bhejein",
  empty:"Abhi koi chat nahi.",created:"Chat ban gaya!",
  invalid:"Sahi Friend UID dalein.",self:"Khud se chat nahi kar sakte.",
  sent:"Message bhej diya.",failed:"Error: ",
  signupMode:"Account banaye",
  loginMode:"Account hai? Login karein"
 }
};

function t(key){return words[language][key] || words.en[key]}

function updateLanguage(){
 document.documentElement.lang=language;
 document.getElementById("authTitle").textContent=t("welcome");
 document.getElementById("authDescription").textContent=t("description");
 document.getElementById("emailLabel").textContent=t("email");
 document.getElementById("passwordLabel").textContent=t("password");
 document.getElementById("accountTitle").textContent=t("account");
 document.getElementById("copyUID").textContent=t("copy");
 document.getElementById("logout").textContent=t("logout");
 document.getElementById("chatsTitle").textContent=t("chats");
 document.getElementById("friendLabel").textContent=t("friend");
 document.getElementById("createChat").textContent=t("start");
 document.getElementById("sendButton").textContent=t("send");
 document.getElementById("messageInput").placeholder=t("type");
 document.getElementById("authButton").textContent=isSignup?t("signup"):t("login");
 document.getElementById("toggleAuth").textContent=isSignup?t("loginMode"):t("signup");
 if(!activeChat) document.getElementById("chatHeader").textContent=t("select");
}
document.getElementById("language").value=language;
document.getElementById("language").addEventListener("change",e=>{
 language=e.target.value;
 localStorage.setItem("digichat-language",language);
 updateLanguage();
});
updateLanguage();

const statusBox=document.getElementById("status");
const chatStatus=document.getElementById("chatStatus");

document.getElementById("toggleAuth").onclick=()=>{
 isSignup=!isSignup;
 statusBox.textContent="";
 updateLanguage();
};

document.getElementById("authButton").onclick=async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email || !password){
  statusBox.textContent="Enter email and password.";
  return;
 }
 if(password.length<6){
  statusBox.textContent="Password must have at least 6 characters.";
  return;
 }

 try{
  if(isSignup){
   await createUserWithEmailAndPassword(auth,email,password);
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
  statusBox.textContent="";
 }catch(error){
  statusBox.textContent=t("failed")+error.message;
 }
};

onAuthStateChanged(auth,user=>{
 currentUser=user;
 document.getElementById("authBox").classList.toggle("hidden",!!user);
 document.getElementById("mainBox").classList.toggle("hidden",!user);

 if(user){
  document.getElementById("userEmail").textContent=user.email;
  document.getElementById("uidText").textContent="UID: "+user.uid;
  loadChats();
 }else{
  if(stopChats) stopChats();
  if(stopMessages) stopMessages();
  stopChats=null;stopMessages=null;
  activeChat=null;
  document.getElementById("chatList").replaceChildren();
  document.getElementById("messages").replaceChildren();
 }
});

document.getElementById("copyUID").onclick=async()=>{
 if(!currentUser)return;
 try{
  await navigator.clipboard.writeText(currentUser.uid);
  chatStatus.textContent="UID copied!";
 }catch{
  chatStatus.textContent="Copy failed. Select and copy the UID manually.";
 }
};

document.getElementById("logout").onclick=()=>signOut(auth);

function loadChats(){
 if(stopChats)stopChats();

 const q=query(
  collection(db,"chats"),
  where("members","array-contains",currentUser.uid)
 );

 stopChats=onSnapshot(q,snapshot=>{
  const list=document.getElementById("chatList");
  list.replaceChildren();

  if(snapshot.empty){
   const p=document.createElement("p");
   p.textContent=t("empty");
   list.append(p);
   return;
  }

  snapshot.forEach(chatDoc=>{
   const data=chatDoc.data();
   const other=data.members.find(id=>id!==currentUser.uid);
   const item=document.createElement("div");
   item.className="chatItem";
   item.textContent="Friend UID: "+(other||"Unknown");
   item.onclick=()=>openChat(chatDoc.id,other);
   list.append(item);
  });
 },error=>{
  chatStatus.textContent=t("failed")+error.message;
 });
}

document.getElementById("createChat").onclick=async()=>{
 if(!currentUser)return;
 const friendUID=document.getElementById("friendUID").value.trim();

 if(!friendUID || friendUID.length<10){
  chatStatus.textContent=t("invalid");
  return;
 }
 if(friendUID===currentUser.uid){
  chatStatus.textContent=t("self");
  return;
 }

 try{
  const chatRef=await addDoc(collection(db,"chats"),{
   members:[currentUser.uid,friendUID],
   createdAt:serverTimestamp()
  });
  chatStatus.textContent=t("created");
  document.getElementById("friendUID").value="";
  openChat(chatRef.id,friendUID);
 }catch(error){
  chatStatus.textContent=t("failed")+error.message;
 }
};

function openChat(chatId,friendUID){
 activeChat=chatId;
 if(stopMessages)stopMessages();

 document.getElementById("chatHeader").textContent=
  "Chat with: "+(friendUID||"Friend");

 const messageArea=document.getElementById("messages");
 messageArea.replaceChildren();

 const q=query(
  collection(db,"chats",chatId,"messages"),
  orderBy("createdAt","asc")
 );

 stopMessages=onSnapshot(q,snapshot=>{
  messageArea.replaceChildren();

  snapshot.forEach(messageDoc=>{
   const data=messageDoc.data();
   const bubble=document.createElement("div");
   bubble.className="msg"+
    (data.senderId===currentUser.uid?" mine":"");

   const content=document.createElement("div");
   content.textContent=data.text || "";
   bubble.append(content);

   const label=document.createElement("div");
   label.className="small";
   label.textContent=data.senderId===currentUser.uid?"You":"Friend";
   bubble.append(label);

   messageArea.append(bubble);
  });

  messageArea.scrollTop=messageArea.scrollHeight;
 },error=>{
  chatStatus.textContent=t("failed")+error.message;
 });
}

async function sendMessage(){
 if(!currentUser || !activeChat)return;

 const input=document.getElementById("messageInput");
 const message=input.value.trim();
 if(!message)return;

 try{
  await addDoc(
   collection(db,"chats",activeChat,"messages"),
   {
    text:message,
    senderId:currentUser.uid,
    createdAt:serverTimestamp()
   }
  );
  input.value="";
 }catch(error){
  chatStatus.textContent=t("failed")+error.message;
 }
}

document.getElementById("sendButton").onclick=sendMessage;
document.getElementById("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
