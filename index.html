
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10111b">

  <title>DigiChat - Connect Instantly</title>
  <meta name="description" content="DigiChat - A simple and secure messaging platform.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-container">

    <header class="brand">
      <div class="brand-icon">D</div>
      <h1>Digi<span>Chat</span></h1>
      <p>Connect. Chat. Communicate.</p>
    </header>

    <main class="auth-card">

      <div class="auth-heading">
        <h2 id="formTitle">Welcome Back!</h2>
        <p id="formSubtitle">Login to continue to DigiChat</p>
      </div>

      <div class="tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="registerTab" class="tab">Register</button>
      </div>

      <form id="authForm">

        <div class="form-group" id="nameGroup" hidden>
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" minlength="6" required>
        </div>

        <div class="form-group" id="confirmGroup" hidden>
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm password">
        </div>

        <button type="submit" id="submitBtn" class="primary-btn">
          Login
        </button>

      </form>

      <p id="message" class="message" aria-live="polite"></p>

      <div id="userPanel" hidden>
        <div class="success-icon">✓</div>
        <h3>You're Connected!</h3>
        <p id="userEmail"></p>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>

      <div class="auth-footer">
        <p>By continuing, you agree to use DigiChat responsibly.</p>
      </div>

    </main>

    <footer>
      <p>© 2026 DigiTech Ecosystem | DigiChat</p>
      <p>Made for better connections ❤️</p>
    </footer>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
