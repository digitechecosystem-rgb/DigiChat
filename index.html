
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075e54">

<title>DigiChat - By DigiTech</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, "Noto Sans Devanagari", sans-serif;
  background: #e9edef;
  color: #222;
  height: 100vh;
}

.app {
  max-width: 1200px;
  height: 100vh;
  margin: auto;
  display: flex;
  background: white;
  overflow: hidden;
}

.sidebar {
  width: 340px;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
}

.brand {
  background: #075e54;
  color: white;
  padding: 22px;
}

.brand h2 {
  font-size: 27px;
}

.brand small {
  opacity: .85;
}

.top {
  padding: 12px;
  background: #f5f6f6;
}

select {
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: white;
  width: 100%;
  cursor: pointer;
}

.search {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  margin-top: 10px;
  outline: none;
}

.section {
  padding: 16px;
  color: #078477;
  font-weight: bold;
}

.contact {
  padding: 17px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.contact:hover {
  background: #f5f6f6;
}

.avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #d8eee9;
  display: grid;
  place-items: center;
  font-weight: bold;
  color: #075e54;
  flex-shrink: 0;
}

.contact small {
  color: #777;
}

.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.chat-header {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #eee;
  background: #f5f6f6;
}

.chat-header h3 {
  font-size: 17px;
}

.online {
  font-size: 12px;
  color: #078477;
  margin-top: 4px;
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  background: #efeae2;
}

.bubble {
  width: fit-content;
  max-width: 80%;
  padding: 12px 15px;
  margin-bottom: 12px;
  border-radius: 12px;
  background: white;
  box-shadow: 0 1px 2px #ccc;
  overflow-wrap: anywhere;
}

.bubble.me {
  margin-left: auto;
  background: #d9fdd3;
}

.time {
  display: block;
  text-align: right;
  font-size: 10px;
  color: #777;
  margin-top: 6px;
}

.welcome {
  margin: auto;
  text-align: center;
  color: #666;
  padding: 25px;
  line-height: 1.8;
}

.composer {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #f5f6f6;
}

.composer input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 0;
  border-radius: 25px;
  outline: none;
}

.send {
  background: #075e54;
  color: white;
  border: 0;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  cursor: pointer;
  font-size: 20px;
}

.send:hover {
  background: #064d45;
}

@media(max-width:650px) {
  .sidebar {
    width: 110px;
  }

  .brand {
    padding: 13px 5px;
    text-align: center;
  }

  .brand h2 {
    font-size: 16px;
  }

  .brand small {
    font-size: 10px;
  }

  .top {
    padding: 6px;
  }

  .top select {
    font-size: 11px;
    padding: 8px 2px;
  }

  .search {
    font-size: 10px;
    padding: 8px 4px;
  }

  .section {
    font-size: 11px;
    padding: 10px 3px;
    text-align: center;
  }

  .contact {
    padding: 12px 5px;
    justify-content: center;
  }

  .contact .details {
    display: none;
  }

  .chat-header {
    padding: 12px 8px;
  }

  .chat-header h3 {
    font-size: 14px;
  }

  .messages {
    padding: 12px;
  }

  .composer {
    padding: 8px;
  }

  .composer input {
    padding: 12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">
      <h2>💬 DigiChat</h2>
      <small id="brandSub">By DigiTech</small>
    </div>

    <div class="top">

      <select id="language">
        <option value="en">🇬🇧 English</option>
        <option value="mr">🇮🇳 मराठी</option>
        <option value="hi">🇮🇳 हिन्दी</option>
      </select>

      <input
        class="search"
        id="search"
        placeholder="Search chats..."
        oninput="searchChats()"
      >

    </div>

    <div class="section" id="chatTitle">MY CHATS</div>

    <div class="contact" onclick="openChat()">

      <div class="avatar">F</div>

      <div class="details">
        <b class="friend-name">My Friend</b>
        <br>
        <small id="lastMessage">Start a conversation</small>
      </div>

    </div>

  </aside>

  <!-- CHAT AREA -->
  <main class="chat">

    <header class="chat-header">

      <div class="avatar">F</div>

      <div>
        <h3 class="friend-name">My Friend</h3>
        <div class="online" id="status">Demo chat</div>
      </div>

    </header>

    <section class="messages" id="messages">

      <div class="welcome" id="welcome">
        <h2>Welcome to DigiChat 👋</h2>
        <p>Your private messaging space.</p>
        <p>Select your language and start chatting.</p>
      </div>

    </section>

    <!-- MESSAGE INPUT -->
    <form class="composer" id="chatForm">

      <input
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button class="send" type="submit">➤</button>

    </form>

  </main>

</div>

<script>

// ALL LANGUAGE TRANSLATIONS

const translations = {

  en: {
    chats: "MY CHATS",
    search: "Search chats...",
    start: "Start a conversation",
    welcome: "Welcome to DigiChat 👋",
    intro: "Your private messaging space.",
    select: "Select your language and start chatting.",
    input: "Type a message...",
    status: "Demo chat",
    friend: "My Friend",
    brand: "By DigiTech"
  },

  mr: {
    chats: "माझ्या गप्पा",
    search: "गप्पा शोधा...",
    start: "संवाद सुरू करा",
    welcome: "DigiChat मध्ये तुमचे स्वागत आहे 👋",
    intro: "तुमची खाजगी संदेश पाठवण्याची जागा.",
    select: "तुमची भाषा निवडा आणि गप्पा सुरू करा.",
    input: "संदेश लिहा...",
    status: "डेमो चॅट",
    friend: "माझा मित्र",
    brand: "DigiTech कडून"
  },

  hi: {
    chats: "मेरी चैट",
    search: "चैट खोजें...",
    start: "बातचीत शुरू करें",
    welcome: "DigiChat में आपका स्वागत है 👋",
    intro: "आपकी निजी मैसेजिंग जगह।",
    select: "अपनी भाषा चुनें और चैट शुरू करें।",
    input: "संदेश लिखें...",
    status: "डेमो चैट",
    friend: "मेरा दोस्त",
    brand: "DigiTech की ओर से"
  }

};


// LANGUAGE CHANGE FUNCTION

function changeLanguage() {

  const lang = document.getElementById("language").value;

  const t = translations[lang];

  document.documentElement.lang = lang;

  document.getElementById("chatTitle").textContent = t.chats;

  document.getElementById("search").placeholder = t.search;

  document.getElementById("lastMessage").textContent = t.start;

  document.getElementById("status").textContent = t.status;

  document.getElementById("messageInput").placeholder = t.input;

  document.getElementById("brandSub").textContent = t.brand;

  document.querySelectorAll(".friend-name").forEach(el => {
    el.textContent = t.friend;
  });

  document.getElementById("welcome").innerHTML = `
    <h2>${t.welcome}</h2>
    <p>${t.intro}</p>
    <p>${t.select}</p>
  `;

  localStorage.setItem("digichat-language", lang);

  searchChats();

}


// OPEN CHAT

function openChat() {

  document.getElementById("welcome").style.display = "none";

  document.getElementById("messageInput").focus();

}


// SEARCH CHAT

function searchChats() {

  const lang = document.getElementById("language").value;

  const value = document.getElementById("search").value.toLowerCase();

  const friend = translations[lang].friend.toLowerCase();

  const contact = document.querySelector(".contact");

  contact.style.display =
    friend.includes(value) || "my friend".includes(value)
      ? "flex"
      : "none";

}


// SEND MESSAGE - DEMO ONLY

document.getElementById("chatForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const input = document.getElementById("messageInput");

  const text = input.value.trim();

  if (!text) return;

  openChat();

  const bubble = document.createElement("div");

  bubble.className = "bubble me";

  bubble.textContent = text;

  const time = document.createElement("span");

  time.className = "time";

  time.textContent = new Date().toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

  bubble.appendChild(time);

  document.getElementById("messages").appendChild(bubble);

  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;

  document.getElementById("lastMessage").textContent = text;

  input.value = "";

});


// LOAD SAVED LANGUAGE

const savedLanguage = localStorage.getItem("digichat-language");

if (savedLanguage && translations[savedLanguage]) {
  document.getElementById("language").value = savedLanguage;
}

document.getElementById("language").addEventListener(
  "change",
  changeLanguage
);

changeLanguage();

</script>

</body>
</html>
