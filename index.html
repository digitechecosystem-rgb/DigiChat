
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>DigiChat - Messaging</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- AUTHENTICATION VIEW -->
  <section id="authView" class="auth-view">
    <div class="auth-container">

      <div class="auth-brand">
        <div class="brand-icon">D</div>
        <h1>DigiChat</h1>
        <p>Connect. Chat. Communicate.</p>
      </div>

      <div class="auth-tabs">
        <button type="button" id="loginTab" class="auth-tab active">
          Login
        </button>
        <button type="button" id="registerTab" class="auth-tab">
          Register
        </button>
      </div>

      <form id="authForm">

        <h2 id="formTitle">Welcome Back!</h2>
        <p id="formSubtitle">Login to continue to DigiChat</p>

        <div id="nameGroup" class="form-group" hidden>
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
          >
        </div>

        <div id="usernameGroup" class="form-group" hidden>
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Choose username"
            autocomplete="username"
          >
          <small id="usernameStatus"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >
        </div>

        <div id="confirmGroup" class="form-group" hidden>
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
          >
        </div>

        <p id="message" class="form-message"></p>

        <button type="submit" id="submitBtn" class="primary-btn">
          Login
        </button>

      </form>
    </div>
  </section>


  <!-- MAIN APPLICATION -->
  <section id="appView" hidden>

    <div class="dashboard">

      <!-- LEFT SIDEBAR -->
      <aside class="sidebar">

        <div class="sidebar-brand">
          <div class="brand-icon">D</div>
          <h2>DigiChat</h2>
        </div>

        <div class="account-card">
          <div class="account-avatar" id="sidebarAvatar">D</div>

          <div class="account-info">
            <h3 id="sidebarName">User</h3>
            <p id="sidebarEmail"></p>
            <p id="sidebarUsername"></p>
            <small id="sidebarDigiId"></small>
          </div>
        </div>

        <p class="menu-heading">MENU</p>

        <nav class="sidebar-menu">

          <button
            type="button"
            class="nav-item active"
            data-page="messages"
          >
            <span>💬</span>
            Messages
          </button>

          <button
            type="button"
            class="nav-item"
            data-page="contacts"
          >
            <span>👥</span>
            Contacts
          </button>

          <button
            type="button"
            class="nav-item"
            data-page="profile"
          >
            <span>👤</span>
            Profile
          </button>

          <button
            type="button"
            class="nav-item"
            data-page="settings"
          >
            <span>⚙️</span>
            Settings
          </button>

        </nav>

        <div class="sidebar-bottom">
          <button type="button" id="logoutBtn" class="logout-btn">
            <span>↪</span> Logout
          </button>
        </div>

      </aside>


      <!-- CONVERSATION SIDEBAR -->
      <aside class="conversation-sidebar">

        <div class="conversation-top">

          <div class="conversation-title">
            <h2 id="listTitle">Messages</h2>

            <button
              type="button"
              id="newChatBtn"
              class="new-chat-btn"
              title="New Chat"
            >
              +
            </button>
          </div>

          <form id="searchForm" class="search-form">
            <span>🔍</span>
            <input
              type="text"
              id="searchInput"
              placeholder="Search username or DigiChat ID..."
              autocomplete="off"
            >
          </form>

        </div>

        <div id="searchResults" class="search-results" hidden></div>

        <div id="conversationsList" class="conversations-list">
          <div class="empty-state">
            <p>Your conversations will appear here.</p>
          </div>
        </div>

      </aside>


      <!-- CHAT AREA -->
      <main class="chat-area">

        <!-- WELCOME SCREEN -->
        <div id="chatWelcome" class="chat-welcome">

          <div class="welcome-icon">💬</div>

          <h2>Welcome to DigiChat</h2>

          <p>
            Select a conversation to start messaging.
          </p>

        </div>


        <!-- CHAT PANEL -->
        <section id="chatPanel" class="chat-panel" hidden>

          <header class="chat-header">

            <!-- MOBILE BACK BUTTON -->
            <button
              type="button"
              id="mobileBackBtn"
              class="mobile-back-btn"
              aria-label="Back to conversations"
            >
              ←
            </button>

            <div class="chat-avatar" id="chatAvatar">
              D
            </div>

            <div class="chat-user-info">
              <h3 id="activeChatName">User</h3>
              <p id="activeChatUsername">@username</p>
            </div>

          </header>


          <!-- MESSAGES -->
          <div
            id="messagesContainer"
            class="messages-container"
          >
          </div>


          <!-- MESSAGE INPUT -->
          <form id="messageForm" class="message-form">

            <button
              type="button"
              id="emojiBtn"
              class="emoji-btn"
              title="Emoji"
            >
              😊
            </button>

            <input
              type="text"
              id="messageInput"
              placeholder="Type a message..."
              autocomplete="off"
              required
            >

            <button
              type="submit"
              id="sendBtn"
              class="send-btn"
            >
              ➤
            </button>

          </form>

        </section>

        <div class="chat-footer">
          <p>🔒 Your conversations on DigiChat</p>
        </div>

      </main>

    </div>

  </section>


  <!-- FIREBASE APPLICATION -->
  <script type="module" src="app.js"></script>

</body>
</html>
